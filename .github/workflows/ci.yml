name: ci
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build
        run: docker build -t box:${{ github.sha }} .
      - name: Smoke test
        run: scripts/smoke.sh box:${{ github.sha }}
      - name: Push to Fly registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          curl -L https://fly.io/install.sh | sh
          export PATH="$HOME/.fly/bin:$PATH"
          fly auth docker
          docker tag box:${{ github.sha }} registry.fly.io/alversjo-boxes:${{ github.sha }}
          docker tag box:${{ github.sha }} registry.fly.io/alversjo-boxes:latest
          docker push registry.fly.io/alversjo-boxes:${{ github.sha }}
          docker push registry.fly.io/alversjo-boxes:latest
